[project]
name = "linkedin-pipeline"
version = "0.2.0"
description = "Hermes-driven AI-builder content pipeline with LinkedIn publishing and MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "feedparser>=6.0.14",
    "beautifulsoup4>=4.12.2",
    "lxml>=6.0.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "cryptography>=42.0.0",
    "mcp>=1.6.0,<2.0.0",
    "uvicorn>=0.30.0",
    "fastapi>=0.115.0",
    "sse-starlette>=2.1.0",
    "supabase>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.24",
    "ruff>=0.1.0",
    "bandit>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "responses>=0.26.2",
    "ruff>=0.16.4",
]
